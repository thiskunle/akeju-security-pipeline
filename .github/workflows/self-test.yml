name: Self-test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest
  clean:
    uses: ./.github/workflows/security.yml
    with:
      exclude: tests/fixtures
      scan-history: false
      pipeline-ref: ${{ github.sha }}
  planted:
    uses: ./.github/workflows/security.yml
    with:
      path: tests/fixtures/planted
      scan-history: false
      fail-on-findings: false
      pipeline-ref: ${{ github.sha }}
  assert-planted-issues-were-found:
    needs: planted
    runs-on: ubuntu-latest
    env:
      FINDINGS: ${{ needs.planted.outputs.findings }}
    steps:
      - run: |
          echo "Findings in planted fixture: $FINDINGS"
          test "$FINDINGS" -ge 3
